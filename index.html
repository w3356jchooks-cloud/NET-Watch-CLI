<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NET-Watch Dashboard v1.0</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            padding: 20px;
        }
        h1 { color: #58a6ff; }
        .status-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }
        .online { color: #39d353; font-weight: bold; }
        .down { color: #f85149; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📡 NET-Watch Dashboard v1.0</h1>
    <p>Live Web-Based System Connection Status Engine</p>

    <div class="status-box">
        <p><span class="online">[ ONLINE ]</span> github.com (Simulated API Check)</p>
        <p><span class="online">[ ONLINE ]</span> google.com (Simulated API Check)</p>
        <p><span class="down">[ DOWN ]</span> broken-server-demo.net (Timeout Exception)</p>
    </div>

</body>
</html>
